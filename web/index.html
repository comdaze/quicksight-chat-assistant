<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分析助手</title>
<style>
  :root{--ink:#16232b;--muted:#66747b;--line:#d9dfe2;--bg:#f6f8f9;--card:#fff;--brand:#0f7b72;--brand-soft:#e3f2ef;--err:#b3261e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}
  header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;margin:0}
  header .who{margin-left:auto;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
  header .who button{font:inherit;font-size:11px;border:0;background:none;color:var(--brand);cursor:pointer;padding:0}
  .ctx{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  .ctx:empty{display:none}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:#0b5c55}
  #log{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:8px 11px;border-radius:10px;white-space:normal;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.bot.has-chart{max-width:100%;width:100%}
  .msg.err{border-color:#f0c4c0;color:var(--err)}
  .msg.bot.cancelled{color:var(--muted);font-size:13px}
  .msg p{margin:0 0 6px}.msg p:last-child{margin:0}
  .msg ul{margin:4px 0 4px 18px;padding:0}
  .steps{margin-top:6px;font-size:11px;color:var(--muted)}
  .steps summary{cursor:pointer}
  .steps code,.msg code{font-size:11px;background:#f1f4f5;padding:1px 4px;border-radius:4px}
  .hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .hints button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .hints button:hover{border-color:var(--brand);color:var(--brand)}
  .login{align-self:stretch;max-width:none;text-align:center;padding:18px}
  .login button{font:inherit;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:8px 18px;cursor:pointer;margin-top:6px}
  .note{font-size:11px;color:var(--muted);margin:4px 0 0}
  .login .note{font-size:12px;margin-top:8px}
  form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
  textarea{flex:1;resize:none;height:44px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  textarea:disabled{background:#f1f4f5}
  button.send{font:inherit;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:0 16px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
  .typing{color:var(--muted);font-size:12px}
  .cancel{margin-left:8px;font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
  .chartbox{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px;background:#fff}
  .chart{width:100%;height:260px}
  .chartbox .note{margin:2px 4px 0}
  .box{margin-top:8px;padding:8px 10px;border:1px dashed var(--brand);border-radius:8px;background:#f4faf9}
  .box.done{border-style:solid;border-color:#b7d7d1}
  .box.off{border-style:solid;border-color:var(--line);background:var(--bg);color:var(--muted)}
  .box .head{font-size:12px;font-weight:600;color:#0b5c55;margin:0 0 4px}
  .box ul{margin:0 0 0 16px;font-size:12px}
  .box button{font:inherit;font-size:12px;margin:6px 8px 0 0;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:6px;padding:2px 10px;cursor:pointer}
  .box button.primary{background:var(--brand);color:#fff}
  .box button.copy{font-size:11px;padding:0 6px;margin:0 0 0 4px;border-radius:4px}
  .box .note.err{color:var(--err)}
</style>
</head>
<body>
<div class="app">
  <header><h1>分析助手</h1><span class="who" id="who"></span></header>
  <div class="ctx" id="ctx" aria-label="当前控件值"></div>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <label for="q" style="position:absolute;left:-9999px">输入问题</label>
    <textarea id="q" placeholder="输入问题，Enter 发送，Shift+Enter 换行" maxlength="2000"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</div>
<script>
// The embed URL is generated by `qsca attach`: ?analysis=<id>&viewer=<<$pViewer>>&p.<name>=<<$name>>...
const params = new URLSearchParams(location.search);
const ANALYSIS = /^[\w-]{1,512}$/.test(params.get("analysis") || "") ? params.get("analysis") : "";
// QuickSight substitutes <<$param>>; unset or "select all" values (localized, e.g. "全部") mean "no filter".
const ALL_VALUES = /^(\[?all( values)?\]?|select all|null|undefined|全部|全选|所有|全部值)$/i;
const pad = (n) => String(n).padStart(2, "0");
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function cleanValue(v) {
  v = (v || "").trim();
  if (!v || v.startsWith("<<") || ALL_VALUES.test(v)) return "";
  // Date parameters arrive as e.g. "Thu Jan 01 2026 00:00:00 GMT 0000" (the "+" becomes a space): keep the calendar date.
  const text = v.match(/^(?:[A-Za-z]{3},?\s+)?([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+\d{2}:\d{2}/);
  if (text && MONTHS[text[1].toLowerCase()]) return `${text[3]}-${pad(MONTHS[text[1].toLowerCase()])}-${pad(text[2])}`;
  const ymd = v.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T]00:00(?::00(?:\.0+)?)?Z?)?$/);
  if (ymd) return `${ymd[1]}-${pad(ymd[2])}-${pad(ymd[3])}`;
  return v.slice(0, 200);
}
const parameters = {};
for (const [key, value] of params) {
  if (!key.startsWith("p.")) continue;
  const name = key.slice(2);
  if (/^[A-Za-z0-9]{1,128}$/.test(name)) parameters[name] = cleanValue(value);
}
// Current QuickSight user (pViewer dynamic default, optional). Not trusted for access - the server ignores it - it only
// detects that the stored chat session belongs to someone else after a QuickSight user switch in this browser.
const VIEWER = (() => { const v = cleanValue(params.get("viewer")).toLowerCase(); return /^[^\s@]+@[^\s@]+$/.test(v) ? v : ""; })();
const PREFIX = "qsca:";
const AUTH_KEY = PREFIX + "auth";
const chatKey = () => (auth ? `${PREFIX}history:${auth.user.sub}:${ANALYSIS}` : "");
const pendingKey = () => (auth ? `${PREFIX}pending:${auth.user.sub}:${ANALYSIS}` : "");
const SESSION_KEY = PREFIX + "session:" + ANALYSIS;
let sessionId = sessionStorage.getItem(SESSION_KEY) || "";
const history = [];
const $ = (id) => document.getElementById(id);

for (const [name, value] of Object.entries(parameters)) {
  if (!value) continue;
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = `${name}：${value}`;
  $("ctx").append(chip);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function render(md) {
  const blocks = escapeHtml(md).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").split(/\n{2,}/);
  return blocks.map((b) => {
    const lines = b.split("\n");
    if (lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l))) return "<ul>" + lines.map((l) => "<li>" + l.replace(/^\s*([-*]|\d+\.)\s+/, "") + "</li>").join("") + "</ul>";
    return "<p>" + lines.join("<br>") + "</p>";
  }).join("");
}
function add(role, html, extra = "") {
  const div = document.createElement("div");
  div.className = `msg ${role} ${extra}`.trim();
  div.innerHTML = html;
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

// ---- Sign-in: IAM Identity Center (SAML) in a popup; the token lives in this iframe's storage for 8 hours ----
let auth = null;
let mismatchNotice = "";
try {
  const saved = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
  if (saved && saved.token && saved.user && saved.user.exp * 1000 > Date.now() + 60000) auth = saved;
} catch {}
function clearStored() { for (const key of Object.keys(localStorage)) if (key.startsWith(PREFIX)) localStorage.removeItem(key); }
if (auth && VIEWER && auth.user.sub !== VIEWER) {
  mismatchNotice = `QuickSight 当前用户已切换为 ${VIEWER}，之前 ${auth.user.sub} 的聊天会话和记录已清除，请重新登录。`;
  clearStored();
  auth = null;
}
function setInputEnabled(enabled) {
  $("q").disabled = !enabled;
  $("send").disabled = !enabled;
  $("q").placeholder = enabled ? "输入问题，Enter 发送，Shift+Enter 换行" : "请先登录";
}
function renderWho() {
  $("who").innerHTML = "";
  if (!auth) return;
  const name = document.createElement("span");
  name.textContent = auth.user.name || auth.user.sub;
  const out = document.createElement("button");
  out.type = "button"; out.textContent = "退出"; out.onclick = () => signOut("已退出。");
  $("who").append(name, out);
}
function signOut(message) {
  auth = null;
  clearStored();
  history.length = 0;
  for (const node of [...$("log").querySelectorAll(".msg:not(.login)")]) node.remove();
  renderWho();
  showLogin(message);
}
function showGreeting() {
  const box = add("bot", `<p>你好${auth.user.name ? "，" + escapeHtml(auth.user.name) : ""}。我可以按当前控件的筛选查询这个分析的数据、画图解释变化，也可以帮你预览并修改分析里的图表类型。</p>
    <div class="hints"><button type="button">这个分析有哪些图表，各自展示什么？</button><button type="button">按当前筛选，主要指标最近的走势如何？画个图</button><button type="button">哪个维度的值贡献最大？</button></div>`);
  box.querySelector(".hints").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON" && !$("send").disabled) ask(e.target.textContent); });
}
let loginBox = null;
function showLogin(message) {
  setInputEnabled(false);
  if (loginBox) loginBox.remove();
  loginBox = add("bot", `<p>${escapeHtml(message || "请使用 IAM Identity Center 账号登录后提问。")}</p><button type="button" id="loginBtn">使用 Identity Center 登录</button><p class="note" id="loginNote">已登录 QuickSight 时，弹窗通常会自动完成，无需再次输入密码。</p>`, "login");
  loginBox.querySelector("#loginBtn").addEventListener("click", startLogin);
}
function startLogin() {
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(24)), (b) => b.toString(16).padStart(2, "0")).join("");
  const note = loginBox.querySelector("#loginNote");
  const popup = window.open(`/auth/login?nonce=${nonce}`, "qsca-login", "popup,width=520,height=680");
  if (!popup) { note.textContent = "浏览器拦截了登录弹窗，请允许本页面弹出窗口后重试。"; return; }
  note.textContent = "正在通过 Identity Center 登录…";
  let done = false;
  const onMessage = (event) => {
    if (event.origin !== location.origin || event.source !== popup) return;
    const data = event.data || {};
    if (data.type !== "qsca-auth" || data.nonce !== nonce || !data.token) return;
    done = true;
    window.removeEventListener("message", onMessage);
    if (VIEWER && data.user.sub !== VIEWER) {
      note.textContent = `登录的 Identity Center 账号是 ${data.user.sub}，但 QuickSight 当前用户是 ${VIEWER}。请在 Identity Center 门户注销后，用 ${VIEWER} 重新登录。`;
      return;
    }
    auth = { token: data.token, user: data.user };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    if (loginBox) { loginBox.remove(); loginBox = null; }
    renderWho(); setInputEnabled(true); showGreeting(); $("q").focus();
  };
  window.addEventListener("message", onMessage);
  const watch = setInterval(() => {
    if (done) { clearInterval(watch); return; }
    if (popup.closed) {
      clearInterval(watch);
      window.removeEventListener("message", onMessage);
      note.textContent = "登录窗口已关闭，但没有收到登录结果。请重试；若反复出现，请联系管理员。";
    }
  }, 500);
}

// ---- Control suggestions: QuickSight does not let this iframe change controls, so list what to pick ----
function controlsHtml(controls) {
  if (!controls || !controls.length) return "";
  const applied = controls.every((c) => c.value === (parameters[c.parameter] || ""));
  const items = controls.map((c) => {
    const done = c.value === (parameters[c.parameter] || "");
    const copy = c.value.length > 12 ? ` <button type="button" class="copy" data-copy="${escapeHtml(c.value)}">复制</button>` : "";
    return `<li>${done ? "✓ " : ""}<strong>${escapeHtml(c.control)}</strong>：<code>${escapeHtml(c.value)}</code>${copy}</li>`;
  }).join("");
  const head = applied ? "✓ 当前控件已是这些值" : "在上方控件中选择以下值，页面会刷新出对应结果：";
  return `<div class="box${applied ? " done" : ""}"><p class="head">${head}</p><ul>${items}</ul></div>`;
}
function copyText(text, button) {
  const done = (ok) => { button.textContent = ok ? "已复制" : "请手动复制"; setTimeout(() => { button.textContent = "复制"; }, 1600); };
  const fallback = () => {  // the Clipboard API needs a permission QuickSight does not grant this iframe
    const area = document.createElement("textarea");
    area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
    document.body.append(area); area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    area.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}
document.addEventListener("click", (event) => {
  const button = event.target.closest && event.target.closest("button.copy");
  if (button) copyText(button.dataset.copy, button);
});

// ---- Charts: ECharts 6.1.0 served by the web Lambda (no CDN), loaded on first use ----
let echartsLoading = null;
function loadECharts() {
  if (window.echarts) return Promise.resolve(window.echarts);
  if (!echartsLoading) echartsLoading = new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = "/static/echarts-6.1.0.min.js";
    tag.onload = () => resolve(window.echarts);
    tag.onerror = () => { echartsLoading = null; reject(new Error("图表库加载失败，请刷新后重试")); };
    document.head.append(tag);
  });
  return echartsLoading;
}
const liveCharts = new Set();
window.addEventListener("resize", () => liveCharts.forEach((c) => c.resize()));
function chartOption(spec) {
  const many = spec.x.length > 40;
  return {
    animation: false,
    title: { text: spec.title, left: 0, textStyle: { fontSize: 13, fontWeight: 600 } },
    tooltip: { trigger: "axis", confine: true },
    legend: { type: "scroll", bottom: 0, textStyle: { fontSize: 11 } },
    grid: { left: 8, right: 24, top: 46, bottom: many ? 60 : 34, containLabel: true },
    xAxis: { type: "category", data: spec.x, axisLabel: { fontSize: 10, hideOverlap: true } },
    yAxis: { type: "value", scale: spec.type === "line", axisLabel: { fontSize: 10 } },
    dataZoom: many ? [{ type: "inside" }, { type: "slider", height: 14, bottom: 24 }] : [],
    series: spec.series.map((s) => ({ name: s.name, type: spec.type, data: s.data, showSymbol: !many, connectNulls: false, barMaxWidth: 18 })),
  };
}
function previewHtml(change, status) {
  if (!change) return "";
  if (status === "applied") return `<div class="box done"><p>✓ 已应用到分析：“${escapeHtml(change.title)}”改为${escapeHtml(change.to)}。请手动刷新页面查看。</p></div>`;
  if (status === "discarded") return `<div class="box off"><p>已放弃，分析未修改。</p></div>`;
  if (Date.now() / 1000 > change.expires_at) return `<div class="box off"><p>预览已过期，分析未修改。需要的话请重新提出修改。</p></div>`;
  return `<div class="box" data-change="${escapeHtml(change.id)}"><p>这是把“${escapeHtml(change.title)}”改为${escapeHtml(change.to)}的预览，分析尚未修改。</p>
    <button type="button" class="primary apply-change">应用到分析</button><button type="button" class="discard-change">不用了</button></div>`;
}
function chartsHtml(list, turn) {
  return (list || []).map((spec, i) => {
    const notes = (spec.notes || []).map((n) => `<p class="note">${escapeHtml(n)}</p>`).join("");
    const status = spec.pending_change && turn.changes ? turn.changes[spec.pending_change.id] : undefined;
    const chart = spec.type === "none" ? `<p class="head">${escapeHtml(spec.title)}</p>` : `<div class="chart" role="img" aria-label="${escapeHtml(spec.title)}"></div>`;
    return `<div class="chartbox" data-chart="${i}">${chart}${notes}${previewHtml(spec.pending_change, status)}</div>`;
  }).join("");
}
function mountCharts(container, list, turn) {
  if (!list || !list.length) return;
  container.classList.add("has-chart");
  if (list.some((s) => s.type !== "none")) {
    loadECharts().then((ec) => {
      container.querySelectorAll(".chartbox").forEach((box) => {
        const node = box.querySelector(".chart");
        if (!node) return;
        const instance = ec.init(node, null, { renderer: "svg" });
        instance.setOption(chartOption(list[Number(box.dataset.chart)]));
        liveCharts.add(instance);
      });
    }).catch((error) => container.querySelectorAll(".chart").forEach((node) => { node.style.height = "auto"; node.textContent = error.message; }));
  }
  container.querySelectorAll(".box[data-change]").forEach((box) => {
    const id = box.dataset.change;
    const change = list.find((c) => c.pending_change && c.pending_change.id === id).pending_change;
    const settle = (status) => { turn.changes = { ...(turn.changes || {}), [id]: status }; saveHistory(); box.outerHTML = previewHtml(change, status); };
    box.querySelector(".discard-change").onclick = () => settle("discarded");
    box.querySelector(".apply-change").onclick = async (event) => {
      event.target.disabled = true; event.target.textContent = "正在应用…";
      try {
        await api(`/changes/${id}/apply`, { method: "POST", body: JSON.stringify({ analysis: ANALYSIS }) });
        settle("applied");
      } catch (error) {
        event.target.disabled = false; event.target.textContent = "应用到分析";
        let note = box.querySelector(".note.err");
        if (!note) { note = document.createElement("p"); note.className = "note err"; box.append(note); }
        note.textContent = `没有应用：${error.message}`;
      }
    };
  });
}

// ---- Conversation: this browser keeps the last 20 turns per user and analysis for 8 hours ----
function saveHistory() { try { if (auth) localStorage.setItem(chatKey(), JSON.stringify({ at: Date.now(), turns: history.slice(-20) })); } catch {} }
function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(chatKey()) || "null");
    if (saved && Date.now() - saved.at < 8 * 3600 * 1000 && Array.isArray(saved.turns)) return saved.turns;
  } catch {}
  return [];
}
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "Content-Type": "application/json", ...(auth ? { Authorization: `Bearer ${auth.token}` } : {}), ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut("登录已过期，请重新登录。"); throw new Error("登录已过期"); }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function answerHtml(turn) {
  const steps = (turn.steps || []).map((s) => `<li>${s.ok ? "✓" : "✕"} <code>${escapeHtml(s.tool)}</code> ${escapeHtml(JSON.stringify(s.arguments))}</li>`).join("");
  const stats = turn.totalMs ? ` · ${(turn.totalMs / 1000).toFixed(1)} 秒 · ${escapeHtml(turn.model || "")}` : "";
  return render(turn.content || "（无回答）") + chartsHtml(turn.charts, turn) + controlsHtml(turn.controls)
    + (steps ? `<details class="steps"><summary>工具调用 ${turn.steps.length} 次${stats}</summary><ul>${steps}</ul></details>` : "");
}
async function ask(prompt, resumeJob) {
  if (!auth) { showLogin(); return; }
  if (!ANALYSIS) { add("bot", "<p>聊天窗口没有绑定分析（嵌入地址缺少 analysis 参数）。请联系管理员用 qsca attach 重新接入。</p>", "err"); return; }
  $("send").disabled = true;
  add("user", render(prompt));
  const pending = add("bot", `<span class="typing">${resumeJob ? "页面已刷新，继续获取回答…" : "正在查询数据…"}</span>`);
  const started = resumeJob ? resumeJob.at : Date.now();
  try {
    let job = resumeJob;
    if (!job) {
      job = await api("/chat", { method: "POST", body: JSON.stringify({ prompt, analysis: ANALYSIS, parameters, sessionId,
        history: history.slice(-10).map(({ role, content }) => ({ role, content })) }) });
      sessionId = job.sessionId; sessionStorage.setItem(SESSION_KEY, sessionId);
      try { localStorage.setItem(pendingKey(), JSON.stringify({ jobId: job.jobId, prompt, at: started })); } catch {}
    }
    const typing = pending.querySelector(".typing");
    const stop = document.createElement("button");
    stop.type = "button"; stop.className = "cancel"; stop.textContent = "取消";
    stop.onclick = async () => { stop.disabled = true; try { await api(`/jobs/${job.jobId}/cancel`, { method: "POST" }); } catch {} };
    typing.after(stop);
    let result;
    for (;;) {  // the server reports STALLED when the Runtime's heartbeats stop, so there is no client-side limit
      await new Promise((r) => setTimeout(r, Date.now() - started < 60000 ? 2000 : 10000));
      result = await api(`/jobs/${job.jobId}`);
      const secs = Math.round((Date.now() - started) / 1000);
      typing.textContent = `正在查询数据… ${secs >= 120 ? Math.floor(secs / 60) + " 分钟" : secs + " 秒"}`;
      if (result.status !== "RUNNING") break;
    }
    stop.remove();
    try { localStorage.removeItem(pendingKey()); } catch {}
    if (result.status === "CANCELLED") { pending.className = "msg bot cancelled"; pending.textContent = "已取消"; return; }
    if (result.status !== "SUCCEEDED") throw new Error(result.error || "任务失败");
    const turn = { role: "assistant", content: result.answer || "", charts: result.charts || null, controls: result.controls || null,
                   steps: result.steps || [], totalMs: result.totalMs, model: result.model, changes: {} };
    pending.innerHTML = answerHtml(turn);
    mountCharts(pending, turn.charts, turn);
    history.push({ role: "user", content: prompt }, turn);
    saveHistory();
  } catch (error) {
    try { localStorage.removeItem(pendingKey()); } catch {}
    pending.className = "msg bot err";
    pending.textContent = `出错：${error.message}`;
  } finally {
    if (auth) { $("send").disabled = false; $("q").focus(); }
  }
}
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("q").value.trim();
  if (!v || $("send").disabled) return;
  $("q").value = "";
  ask(v);
});
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function replayHistory() {
  const turns = loadHistory();
  if (!turns.length) return;
  history.push(...turns);
  add("bot", `<p class="typing">已恢复本浏览器 8 小时内的 ${Math.ceil(turns.length / 2)} 轮对话。</p>`);
  for (const turn of turns) {
    if (turn.role === "user") add("user", render(turn.content));
    else { const box = add("bot", answerHtml(turn)); mountCharts(box, turn.charts, turn); }
  }
}
function resumePending() {  // a control change reloads this iframe; pick up the answer that was still running
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(pendingKey()) || "null"); } catch {}
  if (!saved || !/^[0-9a-f]{32}$/.test(saved.jobId || "") || Date.now() - saved.at > 30 * 60 * 1000) {
    try { localStorage.removeItem(pendingKey()); } catch {}
    return;
  }
  ask(saved.prompt, { jobId: saved.jobId, at: saved.at });
}
if (auth) { renderWho(); setInputEnabled(true); showGreeting(); replayHistory(); resumePending(); } else { showLogin(mismatchNotice || undefined); }
</script>
