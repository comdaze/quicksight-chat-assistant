<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分析助手</title>
<style>
  :root{--ink:#16232b;--muted:#66747b;--line:#d9dfe2;--bg:#f6f8f9;--card:#fff;--brand:#0f7b72;--brand-soft:#e3f2ef;--err:#b3261e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100%}
  header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;margin:0}
  header .who{margin-left:auto;font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center}
  header .who button{font:inherit;font-size:11px;border:0;background:none;color:var(--brand);cursor:pointer;padding:0}
  .ctx{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  .ctx:empty{padding:0;border:0}  /* keep the grid row: hiding it would shift the 1fr row onto the input form */
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:#0b5c55}
  #log{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:8px 11px;border-radius:10px;white-space:normal;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.bot.has-chart{max-width:100%;width:100%}
  .msg.err{border-color:#f0c4c0;color:var(--err)}
  .msg.bot.cancelled{color:var(--muted);font-size:13px}
  .msg p{margin:0 0 6px}.msg p:last-child{margin:0}
  .msg ul,.msg ol{margin:4px 0 6px 18px;padding:0}
  .msg li>p{margin:0}
  .msg h1,.msg h2,.msg h3,.msg h4,.msg h5,.msg h6{margin:10px 0 4px;line-height:1.35;color:#0b3f3a}
  .msg h1{font-size:17px}.msg h2{font-size:16px}.msg h3{font-size:15px}.msg h4,.msg h5,.msg h6{font-size:14px}
  .msg>:first-child{margin-top:0}
  .msg hr{border:0;border-top:1px solid var(--line);margin:8px 0}
  .msg blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--brand-soft);color:var(--muted)}
  .msg pre{margin:6px 0;padding:6px 8px;background:#f1f4f5;border-radius:6px;overflow:auto}
  .msg pre code{padding:0;background:none}
  .msg .md-table{overflow:auto;margin:6px 0}
  .msg table{border-collapse:collapse;font-size:12px}
  .msg th,.msg td{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .msg th{background:var(--bg)}
  .msg td[align=right],.msg th[align=right]{text-align:right}
  .msg td[align=center],.msg th[align=center]{text-align:center}
  .msg.bot a{color:var(--brand)}
  .steps{margin-top:6px;font-size:11px;color:var(--muted)}
  .steps summary{cursor:pointer}
  .steps code,.msg code{font-size:11px;background:#f1f4f5;padding:1px 4px;border-radius:4px}
  .hints{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .hints button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  .hints button:hover{border-color:var(--brand);color:var(--brand)}
  /* Example questions: a collapsed bar under the input box; expanding shows one tab per group */
  .quick{background:var(--card);padding:0 14px 8px}
  .quick-toggle{font:inherit;font-size:12px;border:0;background:none;color:var(--brand);cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
  .quick-toggle .arrow{display:inline-block;transition:transform .15s}
  .quick-toggle[aria-expanded=true] .arrow{transform:rotate(180deg)}
  .quick-panel{max-height:40vh;overflow:auto;margin-top:6px}
  .quick-tabs{display:flex;flex-wrap:wrap;gap:2px 14px;border-bottom:1px solid var(--line)}
  .quick-tabs button{font:inherit;font-size:12px;border:0;border-bottom:2px solid transparent;background:none;padding:2px 0 4px;margin-bottom:-1px;cursor:pointer;color:var(--muted)}
  .quick-tabs button[aria-selected=true]{color:#0b5c55;border-bottom-color:var(--brand);font-weight:600}
  .quick .note{margin:6px 0 0}
  .quick .hints button:disabled{opacity:.5;cursor:default}
  .login{align-self:stretch;max-width:none;text-align:center;padding:18px}
  .login button{font:inherit;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:8px 18px;cursor:pointer;margin-top:6px}
  .note{font-size:11px;color:var(--muted);margin:4px 0 0}
  .login .note{font-size:12px;margin-top:8px}
  form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
  textarea{flex:1;resize:none;height:44px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  textarea:disabled{background:#f1f4f5}
  button.send{font:inherit;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:0 16px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
  .typing{color:var(--muted);font-size:12px}
  .cancel{margin-left:8px;font-size:12px;color:var(--muted);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
  .chartbox{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px;background:#fff}
  .chart{width:100%;height:260px}
  .chartbox .note{margin:2px 4px 0}
  .box{margin-top:8px;padding:8px 10px;border:1px dashed var(--brand);border-radius:8px;background:#f4faf9}
  .box.done{border-style:solid;border-color:#b7d7d1}
  .box.off{border-style:solid;border-color:var(--line);background:var(--bg);color:var(--muted)}
  .box .head{font-size:12px;font-weight:600;color:#0b5c55;margin:0 0 4px}
  .box ul{margin:0 0 0 16px;font-size:12px}
  .box button{font:inherit;font-size:12px;margin:6px 8px 0 0;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:6px;padding:2px 10px;cursor:pointer}
  .box button.primary{background:var(--brand);color:#fff}
  .box button.copy{font-size:11px;padding:0 6px;margin:0 0 0 4px;border-radius:4px}
  .box .note.err{color:var(--err)}
  .ptable{max-height:260px;overflow:auto;margin-top:4px}
  .ptable table{border-collapse:collapse;font-size:11px;width:100%}
  .ptable th,.ptable td{border:1px solid var(--line);padding:2px 6px;text-align:left;white-space:nowrap}
  .ptable th{background:var(--bg);position:sticky;top:0}
</style>
</head>
<body>
<div class="app">
  <header><h1>分析助手</h1><span class="who" id="who"></span></header>
  <div class="ctx" id="ctx" aria-label="当前控件值"></div>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <label for="q" style="position:absolute;left:-9999px">输入问题</label>
    <textarea id="q" placeholder="输入问题，Enter 发送，Shift+Enter 换行" maxlength="2000"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
  <section class="quick" id="quick" hidden>
    <button type="button" class="quick-toggle" id="quickToggle" aria-expanded="false" aria-controls="quickPanel">示例问题 <span class="arrow" aria-hidden="true">▾</span></button>
    <div class="quick-panel" id="quickPanel" hidden>
      <div class="quick-tabs" id="quickTabs" role="tablist" aria-label="示例问题分组"></div>
      <p class="note" id="quickTip"></p>
      <div class="hints" id="quickList" role="tabpanel"></div>
    </div>
  </section>
</div>
<!-- Vendored, versioned copies served by the web Lambda (web/vendor/README.md); no CDN. -->
<script src="/static/marked-18.1.1.umd.js"></script>
<script src="/static/purify-3.4.17.min.js"></script>
<script>
// The embed URL is generated by `qsca attach`: ?analysis=<id>&viewer=<<$pViewer>>&p.<name>=<<$name>>...
const params = new URLSearchParams(location.search);
const ANALYSIS = /^[\w-]{1,512}$/.test(params.get("analysis") || "") ? params.get("analysis") : "";
// where=dashboard is added by `qsca publish`: the published dashboard does not change when the analysis is edited.
const IN_DASHBOARD = params.get("where") === "dashboard";
// QuickSight substitutes <<$param>>; unset or "select all" values (localized, e.g. "全部") mean "no filter".
const ALL_VALUES = /^(\[?all( values)?\]?|select all|null|undefined|全部|全选|所有|全部值)$/i;
const pad = (n) => String(n).padStart(2, "0");
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function cleanValue(v) {
  v = (v || "").trim();
  if (!v || v.startsWith("<<") || ALL_VALUES.test(v)) return "";
  // Date parameters arrive as e.g. "Thu Jan 01 2026 00:00:00 GMT 0000" (the "+" becomes a space): keep the calendar date.
  const text = v.match(/^(?:[A-Za-z]{3},?\s+)?([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+\d{2}:\d{2}/);
  if (text && MONTHS[text[1].toLowerCase()]) return `${text[3]}-${pad(MONTHS[text[1].toLowerCase()])}-${pad(text[2])}`;
  const ymd = v.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T]00:00(?::00(?:\.0+)?)?Z?)?$/);
  if (ymd) return `${ymd[1]}-${pad(ymd[2])}-${pad(ymd[3])}`;
  return v.slice(0, 200);
}
const parameters = {};
for (const [key, value] of params) {
  if (!key.startsWith("p.")) continue;
  const name = key.slice(2);
  if (/^[A-Za-z0-9]{1,128}$/.test(name)) parameters[name] = cleanValue(value);
}
// Current QuickSight user (pViewer dynamic default, optional). Not trusted for access - the server ignores it - it only
// detects that the stored chat session belongs to someone else after a QuickSight user switch in this browser.
const VIEWER = (() => { const v = cleanValue(params.get("viewer")).toLowerCase(); return /^[^\s@]+@[^\s@]+$/.test(v) ? v : ""; })();
const PREFIX = "qsca:";
const AUTH_KEY = PREFIX + "auth";
const chatKey = () => (auth ? `${PREFIX}history:${auth.user.sub}:${ANALYSIS}` : "");
const pendingKey = () => (auth ? `${PREFIX}pending:${auth.user.sub}:${ANALYSIS}` : "");
const SESSION_KEY = PREFIX + "session:" + ANALYSIS;
let sessionId = sessionStorage.getItem(SESSION_KEY) || "";
const history = [];
const $ = (id) => document.getElementById(id);

for (const [name, value] of Object.entries(parameters)) {
  if (!value) continue;
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = `${name}：${value}`;
  $("ctx").append(chip);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// Model answers are Markdown: parse with marked (GFM: headings, lists, tables), then sanitize with an allow-list.
// No <img>/<iframe>/style: model output must not make the page fetch remote URLs (data exfiltration via prompt injection).
const MD_TAGS = ["p", "br", "strong", "em", "b", "i", "del", "s", "code", "pre", "blockquote", "ul", "ol", "li",
  "h1", "h2", "h3", "h4", "h5", "h6", "hr", "table", "thead", "tbody", "tr", "th", "td", "a", "span", "div"];
const MD_ATTRS = ["href", "title", "align", "start", "class"];
// CommonMark does not close "**" after punctuation when a letter follows, so "**结论：**省内…" (common in Chinese)
// stays literal. Bold any "**…**" span on one line whose ends are not spaces; code spans are tokenized first.
if (window.marked) {
  marked.use({ extensions: [{
    name: "cjkStrong", level: "inline",
    start(src) { const i = src.indexOf("**"); return i < 0 ? undefined : i; },
    tokenizer(src) {
      const match = /^\*\*(?![\s*])([^\n]*?[^\s*])\*\*(?!\*)/.exec(src);
      if (match) return { type: "strong", raw: match[0], text: match[1], tokens: this.lexer.inlineTokens(match[1]) };
    },
  }] });
}
if (window.DOMPurify) {
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") {
      if (!/^https?:\/\//i.test(node.getAttribute("href") || "")) node.removeAttribute("href");
      node.setAttribute("target", "_blank");
      node.setAttribute("rel", "noopener noreferrer");
    }
  });
}
function render(md) {
  if (!window.marked || !window.DOMPurify) return renderPlain(md);
  try {
    const html = marked.parse(String(md), { gfm: true, breaks: true, async: false })
      .replace(/<table>/g, '<div class="md-table"><table>').replace(/<\/table>/g, "</table></div>");
    return DOMPurify.sanitize(html, { ALLOWED_TAGS: MD_TAGS, ALLOWED_ATTR: MD_ATTRS, ALLOW_DATA_ATTR: false });
  } catch (e) {
    return renderPlain(md);
  }
}
// Fallback when the Markdown libraries failed to load: bold, inline code, bullet lists, paragraphs.
function renderPlain(md) {
  const blocks = escapeHtml(md).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").split(/\n{2,}/);
  return blocks.map((b) => {
    const lines = b.split("\n");
    if (lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l))) return "<ul>" + lines.map((l) => "<li>" + l.replace(/^\s*([-*]|\d+\.)\s+/, "") + "</li>").join("") + "</ul>";
    return "<p>" + lines.join("<br>") + "</p>";
  }).join("");
}
function add(role, html, extra = "") {
  const div = document.createElement("div");
  div.className = `msg ${role} ${extra}`.trim();
  div.innerHTML = html;
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

// ---- Sign-in: IAM Identity Center (SAML) in a popup; the token lives in this iframe's storage for 8 hours ----
let auth = null;
let mismatchNotice = "";
try {
  const saved = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
  if (saved && saved.token && saved.user && saved.user.exp * 1000 > Date.now() + 60000) auth = saved;
} catch {}
function clearStored() { for (const key of Object.keys(localStorage)) if (key.startsWith(PREFIX)) localStorage.removeItem(key); }
if (auth && VIEWER && auth.user.sub !== VIEWER) {
  mismatchNotice = `QuickSight 当前用户已切换为 ${VIEWER}，之前 ${auth.user.sub} 的聊天会话和记录已清除，请重新登录。`;
  clearStored();
  auth = null;
}
function setInputEnabled(enabled) {
  $("q").disabled = !enabled;
  $("send").disabled = !enabled;
  $("q").placeholder = enabled ? "输入问题，Enter 发送，Shift+Enter 换行" : "请先登录";
  $("quick").hidden = !enabled;  // example questions only make sense once signed in
  if (!enabled) setQuickOpen(false);
}
function renderWho() {
  $("who").innerHTML = "";
  if (!auth) return;
  const name = document.createElement("span");
  name.textContent = auth.user.name || auth.user.sub;
  name.title = auth.user.sub;
  const out = document.createElement("button");
  out.type = "button"; out.textContent = "退出"; out.onclick = () => signOut("已退出。");
  $("who").append(name, out);
}
function signOut(message) {
  auth = null;
  clearStored();
  history.length = 0;
  for (const node of [...$("log").querySelectorAll(".msg:not(.login)")]) node.remove();
  renderWho();
  showLogin(message);
}
// Example questions, one group per capability. A deployment can replace them (config.json "examples").
const DEFAULT_EXAMPLES = [
  { group: "了解分析", questions: [
    "这个分析有哪些图表，各自展示什么？",
    "这个分析用了哪些数据集和字段？",
    "当前控件选了哪些值？它们会影响哪些图表？",
  ] },
  { group: "数据问答与出图", questions: [
    "按当前筛选，主要指标最近的走势如何？画个图",
    "按月汇总主要指标，并画出趋势图",
    "按主要分类字段统计主要指标，前 5 名画柱状图对比",
  ] },
  { group: "计算分析（代码沙箱）", tip: "pandas 在无网络沙箱中计算", questions: [
    "按月汇总主要指标，计算每月环比变化百分比，并画出环比图",
    "按主要分类字段汇总主要指标，计算各自占总量的比例并排名",
    "按日汇总主要指标，计算 7 日移动平均，和原始值画在同一张图上",
    "按日汇总主要指标，找出偏离均值 2 倍标准差以上的异常日期",
  ] },
  { group: "控件联动", tip: "列出要在上方控件里选的值", questions: [
    "在仪表盘上只看主要指标最大的那个分类",
    "帮我把日期范围切到数据里的最后一个月",
  ] },
  { group: "修改分析", edit: true, tip: "需要编辑权限，在分析编辑界面里使用；先预览，点“应用到分析”才生效", questions: [
    "把第一个折线图改成柱状图，先给我看预览",
    "把第一个折线图改成按月显示",
    "给第一个图表换一个更清楚的标题",
    "新增一个表格：按主要分类字段统计主要指标的平均值，按数值降序",
    "新增一个柱状图：按主要分类字段统计主要指标的总和",
    "撤销",
  ] },
];
const ALL_EXAMPLES = (() => { try { const v = __EXAMPLES__; return Array.isArray(v) && v.length ? v : DEFAULT_EXAMPLES; } catch { return DEFAULT_EXAMPLES; } })();
// Edit examples ("edit": true, or a group named 修改分析) make no sense in a published dashboard.
const EXAMPLES = IN_DASHBOARD ? ALL_EXAMPLES.filter((g) => !(g.edit || /修改/.test(g.group || ""))) : ALL_EXAMPLES;
// Collapsed "示例问题" bar under the input box: one tab per group; clicking a question asks it and folds the panel.
let quickGroup = 0;
function setQuickOpen(open) {
  $("quickToggle").setAttribute("aria-expanded", String(open));
  $("quickPanel").hidden = !open;
  if (open) renderQuick();
}
function renderQuick() {
  const tabs = $("quickTabs"), list = $("quickList");
  tabs.innerHTML = ""; list.innerHTML = "";
  EXAMPLES.forEach((g, i) => {
    const tab = document.createElement("button");
    tab.type = "button"; tab.role = "tab"; tab.textContent = g.group;
    tab.setAttribute("aria-selected", String(i === quickGroup));
    tab.onclick = () => { quickGroup = i; renderQuick(); };
    tabs.append(tab);
  });
  const group = EXAMPLES[quickGroup] || EXAMPLES[0];
  $("quickTip").textContent = group.tip || "";
  $("quickTip").hidden = !group.tip;
  for (const q of group.questions || []) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q; b.disabled = $("send").disabled;
    b.onclick = () => { if ($("send").disabled) return; setQuickOpen(false); ask(q); };
    list.append(b);
  }
}
$("quickToggle").addEventListener("click", () => setQuickOpen($("quickPanel").hidden));
$("quickPanel").addEventListener("keydown", (e) => { if (e.key === "Escape") { setQuickOpen(false); $("quickToggle").focus(); } });
function showGreeting() {
  const hello = `你好${auth.user.name ? "，" + escapeHtml(auth.user.name) : ""}。`;
  add("bot", IN_DASHBOARD
    ? `<p>${hello}我可以按当前控件的筛选查询这个仪表盘的数据、计算并画图，提示控件该选什么值。这里是已发布的仪表盘，不能修改图表：要改请到对应的分析里，改完重新发布仪表盘。不知道问什么时，点输入框下方的“示例问题”。</p>`
    : `<p>${hello}我可以按当前控件的筛选查询这个分析的数据、计算并画图，提示控件该选什么值，也可以预览并修改分析里的图表。不知道问什么时，点输入框下方的“示例问题”展开常用问题。</p>`);
}
let loginBox = null;
function showLogin(message) {
  setInputEnabled(false);
  if (loginBox) loginBox.remove();
  loginBox = add("bot", `<p>${escapeHtml(message || "请使用 IAM Identity Center 账号登录后提问。")}</p><button type="button" id="loginBtn">使用 Identity Center 登录</button><p class="note" id="loginNote">已登录 QuickSight 时，弹窗通常会自动完成，无需再次输入密码。</p>`, "login");
  loginBox.querySelector("#loginBtn").addEventListener("click", startLogin);
}
function startLogin() {
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(24)), (b) => b.toString(16).padStart(2, "0")).join("");
  const note = loginBox.querySelector("#loginNote");
  const popup = window.open(`/auth/login?nonce=${nonce}`, "qsca-login", "popup,width=520,height=680");
  if (!popup) { note.textContent = "浏览器拦截了登录弹窗，请允许本页面弹出窗口后重试。"; return; }
  note.textContent = "正在通过 Identity Center 登录…";
  let done = false;
  const onMessage = (event) => {
    if (event.origin !== location.origin || event.source !== popup) return;
    const data = event.data || {};
    if (data.type !== "qsca-auth" || data.nonce !== nonce || !data.token) return;
    done = true;
    window.removeEventListener("message", onMessage);
    if (VIEWER && data.user.sub !== VIEWER) {
      note.textContent = `登录的 Identity Center 账号是 ${data.user.sub}，但 QuickSight 当前用户是 ${VIEWER}。请在 Identity Center 门户注销后，用 ${VIEWER} 重新登录。`;
      return;
    }
    auth = { token: data.token, user: data.user };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    if (loginBox) { loginBox.remove(); loginBox = null; }
    renderWho(); startSession(false); $("q").focus();
  };
  window.addEventListener("message", onMessage);
  const watch = setInterval(() => {
    if (done) { clearInterval(watch); return; }
    if (popup.closed) {
      clearInterval(watch);
      window.removeEventListener("message", onMessage);
      note.textContent = "登录窗口已关闭，但没有收到登录结果。请重试；若反复出现，请联系管理员。";
    }
  }, 500);
}

// ---- Control suggestions: QuickSight does not let this iframe change controls, so list what to pick ----
function controlsHtml(controls) {
  if (!controls || !controls.length) return "";
  const applied = controls.every((c) => c.value === (parameters[c.parameter] || ""));
  const items = controls.map((c) => {
    const done = c.value === (parameters[c.parameter] || "");
    const copy = c.value.length > 12 ? ` <button type="button" class="copy" data-copy="${escapeHtml(c.value)}">复制</button>` : "";
    return `<li>${done ? "✓ " : ""}<strong>${escapeHtml(c.control)}</strong>：<code>${escapeHtml(c.value)}</code>${copy}</li>`;
  }).join("");
  const head = applied ? "✓ 当前控件已是这些值" : "在上方控件中选择以下值，页面会刷新出对应结果：";
  return `<div class="box${applied ? " done" : ""}"><p class="head">${head}</p><ul>${items}</ul></div>`;
}
function copyText(text, button) {
  const done = (ok) => { button.textContent = ok ? "已复制" : "请手动复制"; setTimeout(() => { button.textContent = "复制"; }, 1600); };
  const fallback = () => {  // the Clipboard API needs a permission QuickSight does not grant this iframe
    const area = document.createElement("textarea");
    area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
    document.body.append(area); area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    area.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}
document.addEventListener("click", (event) => {
  const button = event.target.closest && event.target.closest("button.copy");
  if (button) copyText(button.dataset.copy, button);
});

// ---- Charts: ECharts 6.1.0 served by the web Lambda (no CDN), loaded on first use ----
let echartsLoading = null;
function loadECharts() {
  if (window.echarts) return Promise.resolve(window.echarts);
  if (!echartsLoading) echartsLoading = new Promise((resolve, reject) => {
    const tag = document.createElement("script");
    tag.src = "/static/echarts-6.1.0.min.js";
    tag.onload = () => resolve(window.echarts);
    tag.onerror = () => { echartsLoading = null; reject(new Error("图表库加载失败，请刷新后重试")); };
    document.head.append(tag);
  });
  return echartsLoading;
}
const liveCharts = new Set();
window.addEventListener("resize", () => liveCharts.forEach((c) => c.resize()));
function chartOption(spec) {
  const many = spec.x.length > 40;
  return {
    animation: false,
    title: { text: spec.title, left: 0, textStyle: { fontSize: 13, fontWeight: 600 } },
    tooltip: { trigger: "axis", confine: true },
    legend: { type: "scroll", bottom: 0, textStyle: { fontSize: 11 } },
    grid: { left: 8, right: 24, top: 46, bottom: many ? 60 : 34, containLabel: true },
    xAxis: { type: "category", data: spec.x, axisLabel: { fontSize: 10, hideOverlap: true } },
    yAxis: { type: "value", scale: spec.type === "line", axisLabel: { fontSize: 10 } },
    dataZoom: many ? [{ type: "inside" }, { type: "slider", height: 14, bottom: 24 }] : [],
    series: spec.series.map((s) => ({ name: s.name, type: spec.type, data: s.data, showSymbol: !many, connectNulls: false, barMaxWidth: 18 })),
  };
}
function changeText(change) { return change.summary || `把“${change.title}”改为${change.to}`; }  // older history entries
// turn.changes[id]: "applied" | "discarded" | {status: "published" | "kept", note}
function previewHtml(change, state) {
  if (!change) return "";
  const status = state && typeof state === "object" ? state.status : state;
  const done = `✓ 已应用到分析：${escapeHtml(changeText(change))}。请手动刷新页面查看。`;
  if (status === "published") return `<div class="box done"><p>${done}</p><p class="note">✓ ${escapeHtml(state.note || "已发布到仪表盘")}</p></div>`;
  if (status === "kept") return `<div class="box done"><p>${done}</p><p class="note">没有发布仪表盘；需要时在 QuickSight 里发布，或再改一次后点“发布到仪表盘”。</p></div>`;
  if (status === "applied") {
    if (IN_DASHBOARD) return `<div class="box done"><p>${done}</p></div>`;
    return `<div class="box done" data-publish="${escapeHtml(change.id)}"><p>${done}</p>
      <p class="note">仪表盘不会自动更新。要把分析的当前内容发布到由它发布的仪表盘吗？</p>
      <button type="button" class="primary publish-dashboard">发布到仪表盘</button><button type="button" class="skip-publish">不用了</button></div>`;
  }
  if (status === "discarded") return `<div class="box off"><p>已放弃，分析未修改。</p></div>`;
  if (Date.now() / 1000 > change.expires_at) return `<div class="box off"><p>预览已过期，分析未修改。需要的话请重新提出修改。</p></div>`;
  return `<div class="box" data-change="${escapeHtml(change.id)}"><p>预览：${escapeHtml(changeText(change))}。分析尚未修改。</p>
    <button type="button" class="primary apply-change">应用到分析</button><button type="button" class="discard-change">不用了</button></div>`;
}
function chartsHtml(list, turn) {
  return (list || []).map((spec, i) => {
    const notes = (spec.notes || []).map((n) => `<p class="note">${escapeHtml(n)}</p>`).join("");
    const status = spec.pending_change && turn.changes ? turn.changes[spec.pending_change.id] : undefined;
    let chart;
    if (spec.type === "table") {
      const head = (spec.columns || []).map((c) => `<th>${escapeHtml(c)}</th>`).join("");
      const body = (spec.rows || []).map((r) => `<tr>${r.map((v) => `<td>${escapeHtml(v ?? "")}</td>`).join("")}</tr>`).join("");
      chart = `<p class="head">${escapeHtml(spec.title)}</p><div class="ptable"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    } else if (spec.type === "none") {
      chart = `<p class="head">${escapeHtml(spec.title)}</p>`;
    } else {
      chart = `<div class="chart" role="img" aria-label="${escapeHtml(spec.title)}"></div>`;
    }
    return `<div class="chartbox" data-chart="${i}">${chart}${notes}${previewHtml(spec.pending_change, status)}</div>`;
  }).join("");
}
function mountCharts(container, list, turn) {
  if (!list || !list.length) return;
  container.classList.add("has-chart");
  if (list.some((s) => s.type === "line" || s.type === "bar")) {
    loadECharts().then((ec) => {
      container.querySelectorAll(".chartbox").forEach((box) => {
        const node = box.querySelector(".chart");
        if (!node) return;
        const instance = ec.init(node, null, { renderer: "svg" });
        instance.setOption(chartOption(list[Number(box.dataset.chart)]));
        liveCharts.add(instance);
      });
    }).catch((error) => container.querySelectorAll(".chart").forEach((node) => { node.style.height = "auto"; node.textContent = error.message; }));
  }
  container.querySelectorAll(".box[data-change], .box[data-publish]").forEach((box) => wireChangeBox(box, list, turn));
}
function wireChangeBox(box, list, turn) {
    const id = box.dataset.change || box.dataset.publish;
    const change = list.find((c) => c.pending_change && c.pending_change.id === id).pending_change;
    const settle = (status) => {
      turn.changes = { ...(turn.changes || {}), [id]: status }; saveHistory();
      const holder = document.createElement("div");
      holder.innerHTML = previewHtml(change, status);
      const next = holder.firstElementChild;
      box.replaceWith(next);
      if (next.matches(".box[data-publish]")) wireChangeBox(next, list, turn);
    };
    const failNote = (text) => {
      let note = box.querySelector(".note.err");
      if (!note) { note = document.createElement("p"); note.className = "note err"; box.append(note); }
      note.textContent = text;
    };
    if (box.dataset.publish) {
      box.querySelector(".skip-publish").onclick = () => settle({ status: "kept" });
      box.querySelector(".publish-dashboard").onclick = async (event) => {
        event.target.disabled = true; event.target.textContent = "正在发布…";
        try {
          const result = await api("/dashboards/publish", { method: "POST", body: JSON.stringify({ analysis: ANALYSIS }) });
          const names = (result.published || []).map((d) => `“${d.name}”（第 ${d.version} 版）`).join("、");
          settle({ status: "published", note: `已发布到仪表盘 ${names}。打开仪表盘后刷新即可看到；刚发布时图表可能短暂报错，再刷新一次。` });
        } catch (error) {
          event.target.disabled = false; event.target.textContent = "发布到仪表盘";
          failNote(`没有发布：${error.message}`);
        }
      };
      return;
    }
    box.querySelector(".discard-change").onclick = () => settle("discarded");
    box.querySelector(".apply-change").onclick = async (event) => {
      event.target.disabled = true; event.target.textContent = "正在应用…";
      try {
        await api(`/changes/${id}/apply`, { method: "POST", body: JSON.stringify({ analysis: ANALYSIS }) });
        settle("applied");
      } catch (error) {
        event.target.disabled = false; event.target.textContent = "应用到分析";
        failNote(`没有应用：${error.message}`);
      }
    };
}

// ---- Conversation: this browser keeps the last 20 turns per user and analysis for 8 hours ----
function saveHistory() { try { if (auth) localStorage.setItem(chatKey(), JSON.stringify({ at: Date.now(), turns: history.slice(-20) })); } catch {} }
function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(chatKey()) || "null");
    if (saved && Date.now() - saved.at < 8 * 3600 * 1000 && Array.isArray(saved.turns)) return saved.turns;
  } catch {}
  return [];
}
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "Content-Type": "application/json", ...(auth ? { Authorization: `Bearer ${auth.token}` } : {}), ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut("登录已过期，请重新登录。"); throw new Error("登录已过期"); }
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function answerHtml(turn) {
  const steps = (turn.steps || []).map((s) => `<li>${s.ok ? "✓" : "✕"} <code>${escapeHtml(s.tool)}</code> ${escapeHtml(JSON.stringify(s.arguments))}</li>`).join("");
  const stats = turn.totalMs ? ` · ${(turn.totalMs / 1000).toFixed(1)} 秒 · ${escapeHtml(turn.model || "")}` : "";
  return render(turn.content || "（无回答）") + chartsHtml(turn.charts, turn) + controlsHtml(turn.controls)
    + (steps ? `<details class="steps"><summary>工具调用 ${turn.steps.length} 次${stats}</summary><ul>${steps}</ul></details>` : "");
}
async function ask(prompt, resumeJob) {
  if (!auth) { showLogin(); return; }
  if (!ANALYSIS) { showBindChooser(); return; }
  $("send").disabled = true;
  add("user", render(prompt));
  const pending = add("bot", `<span class="typing">${resumeJob ? "页面已刷新，继续获取回答…" : "正在查询数据…"}</span>`);
  const started = resumeJob ? resumeJob.at : Date.now();
  try {
    let job = resumeJob;
    if (!job) {
      job = await api("/chat", { method: "POST", body: JSON.stringify({ prompt, analysis: ANALYSIS, parameters, sessionId, where: IN_DASHBOARD ? "dashboard" : "analysis",
        history: history.slice(-10).map(({ role, content }) => ({ role, content })) }) });
      sessionId = job.sessionId; sessionStorage.setItem(SESSION_KEY, sessionId);
      try { localStorage.setItem(pendingKey(), JSON.stringify({ jobId: job.jobId, prompt, at: started })); } catch {}
    }
    const typing = pending.querySelector(".typing");
    const stop = document.createElement("button");
    stop.type = "button"; stop.className = "cancel"; stop.textContent = "取消";
    stop.onclick = async () => { stop.disabled = true; try { await api(`/jobs/${job.jobId}/cancel`, { method: "POST" }); } catch {} };
    typing.after(stop);
    let result;
    for (;;) {  // the server reports STALLED when the Runtime's heartbeats stop, so there is no client-side limit
      await new Promise((r) => setTimeout(r, Date.now() - started < 60000 ? 2000 : 10000));
      result = await api(`/jobs/${job.jobId}`);
      const secs = Math.round((Date.now() - started) / 1000);
      typing.textContent = `正在查询数据… ${secs >= 120 ? Math.floor(secs / 60) + " 分钟" : secs + " 秒"}`;
      if (result.status !== "RUNNING") break;
    }
    stop.remove();
    try { localStorage.removeItem(pendingKey()); } catch {}
    if (result.status === "CANCELLED") { pending.className = "msg bot cancelled"; pending.textContent = "已取消"; return; }
    if (result.status !== "SUCCEEDED") throw new Error(result.error || "任务失败");
    const turn = { role: "assistant", content: result.answer || "", charts: result.charts || null, controls: result.controls || null,
                   steps: result.steps || [], totalMs: result.totalMs, model: result.model, changes: {} };
    pending.innerHTML = answerHtml(turn);
    mountCharts(pending, turn.charts, turn);
    history.push({ role: "user", content: prompt }, turn);
    saveHistory();
  } catch (error) {
    try { localStorage.removeItem(pendingKey()); } catch {}
    pending.className = "msg bot err";
    pending.textContent = `出错：${error.message}`;
  } finally {
    if (auth) { $("send").disabled = false; $("q").focus(); }
  }
}
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("q").value.trim();
  if (!v || $("send").disabled) return;
  $("q").value = "";
  ask(v);
});
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function replayHistory() {
  const turns = loadHistory();
  if (!turns.length) return;
  history.push(...turns);
  add("bot", `<p class="typing">已恢复本浏览器 8 小时内的 ${Math.ceil(turns.length / 2)} 轮对话。</p>`);
  for (const turn of turns) {
    if (turn.role === "user") add("user", render(turn.content));
    else { const box = add("bot", answerHtml(turn)); mountCharts(box, turn.charts, turn); }
  }
}
function resumePending() {  // a control change reloads this iframe; pick up the answer that was still running
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(pendingKey()) || "null"); } catch {}
  if (!saved || !/^[0-9a-f]{32}$/.test(saved.jobId || "") || Date.now() - saved.at > 30 * 60 * 1000) {
    try { localStorage.removeItem(pendingKey()); } catch {}
    return;
  }
  ask(saved.prompt, { jobId: saved.jobId, at: saved.at });
}
// ---- Binding: a chat visual added with the bare chat URL (no analysis=) binds itself to its analysis on request ----
function startSession(restore) {
  if (!ANALYSIS) { showBindChooser(); return; }
  setInputEnabled(true); showGreeting();
  if (restore) { replayHistory(); resumePending(); }
  if (!IN_DASHBOARD) checkBinding();
}
function bindNote(box, text, error) {
  let note = box.querySelector(".note.bind");
  if (!note) { note = document.createElement("p"); note.className = "note bind"; box.append(note); }
  note.classList.toggle("err", !!error);
  note.textContent = text;
}
async function bindTo(box, button, analysisId) {
  box.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  button.textContent = "正在绑定…";
  try {
    const result = await api("/bind", { method: "POST", body: JSON.stringify({ analysis: analysisId }) });
    bindNote(box, result.message || "已绑定，请刷新页面。");
    button.textContent = "已绑定";
  } catch (error) {
    box.querySelectorAll("button").forEach((b) => { b.disabled = false; });
    button.textContent = "重试";
    bindNote(box, `没有绑定：${error.message}`, true);
  }
}
async function showBindChooser() {
  setInputEnabled(false);
  $("q").placeholder = "请先绑定分析";
  if (IN_DASHBOARD) {
    add("bot", "<p>这个聊天窗口还没有绑定分析。请到对应的分析里绑定，再重新发布仪表盘。</p>", "err");
    return;
  }
  const box = add("bot", `<p>这个聊天窗口还没有绑定分析。选择它所在的分析（你刚编辑过的通常排在最前面），绑定后刷新页面即可使用。</p><p class="note">正在列出你可以编辑的分析…</p>`);
  try {
    const { analyses } = await api("/bindable");
    box.querySelector(".note").remove();
    if (!analyses.length) { bindNote(box, "没有找到你有编辑权限的分析。绑定需要该分析的编辑权限。", true); return; }
    const list = document.createElement("div");
    list.className = "hints";
    for (const a of analyses) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = a.name + (a.has_unbound_chat ? "（含未绑定的聊天窗口）" : "");
      button.title = `${a.analysis_id} · 最近修改 ${a.updated.slice(0, 16)}`;
      button.onclick = () => bindTo(box, button, a.analysis_id);
      list.append(button);
    }
    box.append(list);
  } catch (error) {
    bindNote(box, `无法列出分析：${error.message}`, true);
  }
}
async function checkBinding() {  // parameters added or removed since binding: offer to update the chat URL
  try {
    const { parameters: names } = await api(`/binding?analysis=${encodeURIComponent(ANALYSIS)}`);
    const expected = names.filter((n) => n !== "pViewer").sort().join(",");
    const current = Object.keys(parameters).sort().join(",");
    const viewerMissing = names.includes("pViewer") && !params.has("viewer");
    if (expected === current && !viewerMissing) return;
    const box = add("bot", `<p>这个分析的参数有变化，聊天窗口拿不到新参数的值。点“更新绑定”后刷新页面即可。</p><div class="hints"><button type="button">更新绑定</button></div>`);
    const button = box.querySelector("button");
    button.onclick = () => bindTo(box, button, ANALYSIS);
  } catch {}  // no view permission or a transient error: the chat works as before
}
if (auth) { renderWho(); startSession(true); } else { showLogin(mismatchNotice || undefined); }
</script>
</body>
